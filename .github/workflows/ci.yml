name: CI

# Every push and pull request: the code convention (lint), typecheck, tests and build, and dist/ must match the build;
# and the privacy check (tools/privacy-check.mjs) on the tracked files and the new commits.
# A pull request that changes dist/ must raise package.json's version (tools/release-check.mjs).
# A push to main whose version has no release yet publishes one: tag v<version>, titled
# "control4-z2m <version>", with the build id the extension reports in its status
# (tools/build-id.mjs) in the notes. A push that leaves the version alone makes no release; if
# it changed dist/ anyway (a push that skipped the pull request), the release job fails.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runners: the project's self-hosted runner takes the runs this repo's own people start (pushes,
# manual runs). A pull request from a fork runs untrusted code, so it goes to GitHub's hosted
# runners, never the self-hosted one. The release job stays hosted too (it needs gh and zip).
jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The code convention (docs/CODE_STYLE.md): formatting, lint rules and import order, as
      # biome.json sets them. `npm run format` fixes what it can.
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      # dist/ is committed and released as-is, so it must match a fresh build of src/
      - name: dist matches src
        run: git diff --exit-code -- dist
      # Every release has its own version: a dist/ change needs a raised version.
      - name: version raised with dist/
        if: github.event_name == 'pull_request'
        run: node tools/release-check.mjs ${{ github.event.pull_request.base.sha }}

  privacy:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The patterns are private (the PRIVATE_PATTERNS secret). A pull request from a fork
      # gets no secrets, so only there may the check skip (it runs again on the push to main
      # after the merge); anywhere else a missing secret fails it.
      - name: Privacy check
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
          ALLOW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '--allow-missing' || '' }}
        run: node tools/privacy-check.mjs $ALLOW --range "$RANGE"

  release:
    needs: [check, privacy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Find the release
        id: build
        run: |
          version=$(node -p "require('./package.json').version")
          id=$(node tools/build-id.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            # The notes name the build that version shipped; a different build means dist/
            # changed without a raised version.
            released=$(gh release view "v$version" --json body --jq .body | grep -oE 'build `[0-9a-f]{12}`' | head -1 | grep -oE '[0-9a-f]{12}')
            if [ -n "$released" ] && [ "$released" != "$id" ]; then
              echo "::error::dist/ is build $id, but version $version was released as build $released: raise package.json's version"
              exit 1
            fi
            echo "Version $version is already released, so there is nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.build.outputs.new == 'true'
        run: |
          mkdir -p out
          cp dist/external_extensions/control4.mjs out/control4-extension.mjs
          cp dist/external_converters/control4.mjs out/control4-converter.mjs
          (cd dist && zip -X -q ../out/control4-z2m.zip external_extensions/control4.mjs external_converters/control4.mjs)
          (cd out && sha256sum control4-z2m.zip control4-extension.mjs control4-converter.mjs > SHA256SUMS)

      - name: Publish
        if: steps.build.outputs.new == 'true'
        env:
          ID: ${{ steps.build.outputs.id }}
          VERSION: ${{ steps.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          cat > notes.md <<EOF
          control4-z2m $VERSION, build \`$ID\`. Once Zigbee2MQTT loads these files, the extension's status reports version $VERSION and this build, and its start-up line names the version (see "Instance status" in the README).

          ## Install

          Unzip \`control4-z2m.zip\` into the Zigbee2MQTT data folder, the one holding \`configuration.yaml\` (\`/config/zigbee2mqtt\` in the Home Assistant add-on). It holds

              external_extensions/control4.mjs
              external_converters/control4.mjs

          Or download \`control4-extension.mjs\` and \`control4-converter.mjs\` and save them as those two files. Both must be named \`control4.mjs\`. \`SHA256SUMS\` lists their checksums.

          \`configuration.yaml\` needs \`serial.adapter: ember\` and \`advanced.enable_external_js: true\`. Then restart Zigbee2MQTT. The README covers the rest, including the Home Assistant blueprints and packages.

          The newest release is always at https://github.com/$REPO/releases/latest/download/control4-z2m.zip

          ## Changes

          EOF
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s' "$prev..HEAD" >> notes.md
          else
            echo "- First release." >> notes.md
          fi
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "control4-z2m $VERSION" --notes-file notes.md --latest
