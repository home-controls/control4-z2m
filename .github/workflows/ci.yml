name: CI

# Every push and pull request: the code convention (lint), typecheck, a fresh build and the tests
# against it; and the privacy check (tools/privacy-check.mjs) on the tracked files and the new commits.
# Pull requests are source-only or releases (docs/adr/0008-source-only-pull-requests.md): one
# leaves dist/ alone, or raises package.json's version and commits dist/ as a fresh build
# (tools/release-check.mjs). A push to main whose version has no release yet publishes one: tag
# v<version>, titled "control4-z2m <version>", with the build id the extension reports in its
# status (tools/build-id.mjs) in the notes; a version like 0.4.2-rc.1 is published as a
# pre-release, which the latest-release link skips. A push that leaves the version alone makes no
# release; if it changed dist/ anyway (a push that skipped the pull request), the release job fails.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runners: the project's self-hosted runner takes the runs this repo's own people start (pushes,
# manual runs, and the release). A pull request from a fork runs untrusted code, and a Dependabot
# update runs new packages' install scripts, so both go to GitHub's hosted runners, never the
# self-hosted one. A Dependabot update is known by its dependabot/ branch as well as its actor:
# when someone comments "@dependabot rebase" or "recreate", the run is credited to them.
jobs:
  check:
    runs-on: ${{ (github.actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The code convention (docs/CODE_STYLE.md): formatting, lint rules and import order, as
      # biome.json sets them. `npm run format` fixes what it can.
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      # Built before the tests, which load the bundles as Zigbee2MQTT does: a source-only change is
      # tested in a fresh build, not in the last release's dist/.
      - name: build
        run: npm run build
      - name: tests
        run: npm test
      # dist/ is committed and released as-is: it changes only in a release, which raises the
      # version and commits it as the fresh build above.
      - name: source-only or a release
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: node tools/release-check.mjs ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  privacy:
    runs-on: ${{ (github.actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The patterns are private (the PRIVATE_PATTERNS secret). A pull request from a fork
      # gets no secrets, nor does a Dependabot run, so only there may the check skip (it runs again
      # on the push to main after the merge); anywhere else a missing secret fails it.
      - name: Privacy check
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
          ALLOW: ${{ (github.actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && '--allow-missing' || '' }}
        run: node tools/privacy-check.mjs $ALLOW --range "$RANGE"

  release:
    needs: [check, privacy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Only a push to main (or a manual run) gets here, never a fork's code. It needs gh and zip,
    # which the self-hosted runner has.
    runs-on: self-hosted
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find the release
        id: build
        run: |
          version=$(node -p "require('./package.json').version")
          id=$(node tools/build-id.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            # The notes name the build that version shipped; a different build means dist/
            # changed without a raised version.
            released=$(gh release view "v$version" --json body --jq .body | grep -oE 'build `[0-9a-f]{12}`' | head -1 | grep -oE '[0-9a-f]{12}')
            if [ -n "$released" ] && [ "$released" != "$id" ]; then
              echo "::error::dist/ is build $id, but version $version was released as build $released: raise package.json's version"
              exit 1
            fi
            echo "Version $version is already released, so there is nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.build.outputs.new == 'true'
        run: |
          mkdir -p out
          cp dist/external_extensions/control4.mjs out/control4-extension.mjs
          cp dist/external_converters/control4.mjs out/control4-converter.mjs
          (cd dist && zip -X -q ../out/control4-z2m.zip external_extensions/control4.mjs external_converters/control4.mjs)
          (cd out && sha256sum control4-z2m.zip control4-extension.mjs control4-converter.mjs > SHA256SUMS)

      - name: Publish
        if: steps.build.outputs.new == 'true'
        env:
          ID: ${{ steps.build.outputs.id }}
          VERSION: ${{ steps.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Changes since the last full release, so a release candidate and its release both list everything new.
          prev=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          case "$VERSION" in
            *-*) kind="--prerelease --latest=false"
                 note="This is a release candidate, for testing before the release. It is published as a pre-release, so the latest-release link below still points at the last full release." ;;
            *) kind="--latest"
               note="" ;;
          esac
          cat > notes.md <<EOF
          control4-z2m $VERSION, build \`$ID\`. Once Zigbee2MQTT loads these files, the extension's status reports version $VERSION and this build, and its start-up line names the version (see "Instance status" in the README).

          $note

          ## Install

          Unzip \`control4-z2m.zip\` into the Zigbee2MQTT data folder, the one holding \`configuration.yaml\` (\`/config/zigbee2mqtt\` in the Home Assistant add-on). It holds

              external_extensions/control4.mjs
              external_converters/control4.mjs

          Or download \`control4-extension.mjs\` and \`control4-converter.mjs\` and save them as those two files. Both must be named \`control4.mjs\`. \`SHA256SUMS\` lists their checksums.

          \`configuration.yaml\` needs \`serial.adapter: ember\` and \`advanced.enable_external_js: true\`. Then restart Zigbee2MQTT. The README covers the rest, including the Home Assistant blueprints and packages.

          The newest release is always at https://github.com/$REPO/releases/latest/download/control4-z2m.zip

          ## Changes

          EOF
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s' "$prev..HEAD" >> notes.md
          else
            echo "- First release." >> notes.md
          fi
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "control4-z2m $VERSION" --notes-file notes.md $kind
