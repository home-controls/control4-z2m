# Control4 dimmer control scripts — DEVICE-AGNOSTIC (portable).
# Drop this in /config/packages/. Every script uses a device picker, so it
# works on any C4 dimmer without editing. Covers the settable commands from
# the APD120 protocol doc: ramp times (c4.dm.tv), and the experimental
# c4.dmx.* / c4.sy.* settings. The on-card Turn-On/Off Fade numbers (exposed
# by the control4-z2m extension) are the everyday control; these scripts reach the rest.

script:
  # General paddle-ramp setter — the physical multi-tap ramp times via c4.dm.tv
  # (fast / on / off / slow-1 / slow-2 / fast-2). The on/off indices also feed
  # the card's transition numbers (the extension mirrors them into on/off_transition).
  control4_set_dimmer_ramp:
    alias: "Control4: Set Dimmer Ramp Time"
    description: >-
      Set one of a Control4 dimmer's transition (ramp) times via the c4.dm.tv
      protocol. Pick the device, which ramp, and the duration in seconds.
    icon: mdi:transition
    mode: single
    fields:
      target_device:
        name: Control4 Dimmer
        description: "Select a Zigbee2MQTT Control4 dimmer"
        required: true
        selector:
          device: {integration: mqtt, manufacturer: Control4}
      ramp:
        name: Ramp
        required: true
        default: "2"
        selector:
          select:
            options:
              - {label: "Turn-on ramp", value: "2"}
              - {label: "Turn-off ramp", value: "3"}
              - {label: "Fast ramp", value: "1"}
              - {label: "Slow fade 1", value: "4"}
              - {label: "Slow fade 2", value: "5"}
              - {label: "Fast ramp 2", value: "6"}
      seconds:
        name: Duration (seconds)
        required: true
        default: 1.0
        selector:
          number: {min: 0, max: 60, step: 0.1, mode: box, unit_of_measurement: s}
    variables:
      ieee: "{{ ((device_attr(target_device, 'identifiers') or []) | map('last') | select('search', '^zigbee2mqtt_0x') | first | default('')) | replace('zigbee2mqtt_', '') }}"
    sequence:
      - if: "{{ not ieee }}"
        then:
          - stop: "Not a Zigbee2MQTT device: {{ target_device }}"
            error: true
      - variables:
          c4_params:
            index: "{{ ramp | int(2) }}"
            time_ms: "{{ (seconds | float(1.0) * 1000) | int }}"
      - action: mqtt.publish
        data:
          topic: "control4/{{ ieee }}/set"
          payload: "{{ {'set_ramp_rate': c4_params} | to_json }}"

  # EXPERIMENTAL — phase / dim mode from the APD120 doc. These use the c4.dmx.*
  # namespace (documented for the APD120); the DIM1-Z uses c4.dm.* for telemetry
  # so this may not take. Sent via the send_raw passthrough.
  #   dim mode (c4.dmx.dim):  02 = adaptive phase (others: try 00 / 01)
  #   phase load (c4.dmx.plm): 00 = auto-detect (others: 01 / 02 = fwd / rev)
  control4_set_dimmer_phase_mode:
    alias: "Control4: Set Dimmer Phase/Dim Mode (experimental)"
    description: >-
      EXPERIMENTAL. Set a Control4 dimmer's phase/dim mode (c4.dmx.dim or
      c4.dmx.plm). Documented for the APD120 — may not apply to the DIM1-Z.
    icon: mdi:sine-wave
    mode: single
    fields:
      target_device:
        name: Control4 Dimmer
        required: true
        selector:
          device: {integration: mqtt, manufacturer: Control4}
      setting:
        name: Setting
        required: true
        default: "dim"
        selector:
          select:
            options:
              - {label: "Dim mode (c4.dmx.dim)", value: "dim"}
              - {label: "Phase load mode (c4.dmx.plm)", value: "plm"}
      value:
        name: Value (0-2)
        required: true
        default: 2
        selector:
          number: {min: 0, max: 2, step: 1, mode: box}
    variables:
      ieee: "{{ ((device_attr(target_device, 'identifiers') or []) | map('last') | select('search', '^zigbee2mqtt_0x') | first | default('')) | replace('zigbee2mqtt_', '') }}"
    sequence:
      - if: "{{ not ieee }}"
        then:
          - stop: "Not a Zigbee2MQTT device: {{ target_device }}"
            error: true
      - variables:
          c4_params:
            cmd: "c4.dmx.{{ setting }} {{ '%02x' % (value | int(0)) }}"
            dst_ep: 1
      - action: mqtt.publish
        data:
          topic: "control4/{{ ieee }}/set"
          payload: "{{ {'send_raw': c4_params} | to_json }}"

  # EXPERIMENTAL — button-to-load preset (c4.dmx.blc): the load level a given
  # physical button / preset drives. ch 0 = primary, 1 = companion. Level
  # 0-255 (0xff full, 0x1e min dim, 0 off). APD120 doc; unverified on DIM1-Z.
  control4_set_dimmer_button_level:
    alias: "Control4: Set Dimmer Button Level (experimental)"
    description: >-
      EXPERIMENTAL. Map a Control4 dimmer button/preset to a load level via
      c4.dmx.blc. Documented for the APD120 — may not apply to the DIM1-Z.
    icon: mdi:gesture-tap-button
    mode: single
    fields:
      target_device:
        name: Control4 Dimmer
        required: true
        selector:
          device: {integration: mqtt, manufacturer: Control4}
      channel:
        name: Channel
        description: "0 = primary, 1 = companion"
        required: true
        default: 0
        selector:
          number: {min: 0, max: 1, step: 1, mode: box}
      button:
        name: Button ID
        description: "Physical button id (e.g. 1 top, 3, 4; 7 on / 8 off)"
        required: true
        default: 1
        selector:
          number: {min: 0, max: 12, step: 1, mode: box}
      level:
        name: Level (0-255)
        description: "Load level: 255 full, 30 min dim, 0 off"
        required: true
        default: 255
        selector:
          number: {min: 0, max: 255, step: 1, mode: box}
    variables:
      ieee: "{{ ((device_attr(target_device, 'identifiers') or []) | map('last') | select('search', '^zigbee2mqtt_0x') | first | default('')) | replace('zigbee2mqtt_', '') }}"
    sequence:
      - if: "{{ not ieee }}"
        then:
          - stop: "Not a Zigbee2MQTT device: {{ target_device }}"
            error: true
      - variables:
          c4_params:
            cmd: "c4.dmx.blc {{ '%02x' % (channel | int(0)) }} {{ '%02x' % (button | int(1)) }} {{ '%02x' % (level | int(255)) }}"
            dst_ep: 1
      - action: mqtt.publish
        data:
          topic: "control4/{{ ieee }}/set"
          payload: "{{ {'send_raw': c4_params} | to_json }}"

  # EXPERIMENTAL — power-monitoring timer intervals (c4.dmx.pmti). Two intervals
  # (provisioning used 0002; post-button-press 0004). APD120 doc.
  control4_set_dimmer_power_monitor_interval:
    alias: "Control4: Set Dimmer Power-Monitor Interval (experimental)"
    description: >-
      EXPERIMENTAL. Set the power-monitoring timer intervals via c4.dmx.pmti.
      Documented for the APD120 — may not apply to the DIM1-Z.
    icon: mdi:timer-cog
    mode: single
    fields:
      target_device:
        name: Control4 Dimmer
        required: true
        selector:
          device: {integration: mqtt, manufacturer: Control4}
      interval_a:
        name: Interval A
        required: true
        default: 2
        selector:
          number: {min: 0, max: 65535, step: 1, mode: box}
      interval_b:
        name: Interval B
        required: true
        default: 2
        selector:
          number: {min: 0, max: 65535, step: 1, mode: box}
    variables:
      ieee: "{{ ((device_attr(target_device, 'identifiers') or []) | map('last') | select('search', '^zigbee2mqtt_0x') | first | default('')) | replace('zigbee2mqtt_', '') }}"
    sequence:
      - if: "{{ not ieee }}"
        then:
          - stop: "Not a Zigbee2MQTT device: {{ target_device }}"
            error: true
      - variables:
          c4_params:
            cmd: "c4.dmx.pmti {{ '%04x' % (interval_a | int(2)) }} {{ '%04x' % (interval_b | int(2)) }}"
            dst_ep: 1
      - action: mqtt.publish
        data:
          topic: "control4/{{ ieee }}/set"
          payload: "{{ {'send_raw': c4_params} | to_json }}"

  # EXPERIMENTAL — Zigbee radio TX power (c4.sy.zpw). Provisioning used 00.
  # APD120 doc. Changing radio power can affect mesh reliability — use with care.
  control4_set_dimmer_radio_power:
    alias: "Control4: Set Dimmer Radio Power (experimental)"
    description: >-
      EXPERIMENTAL. Set the Zigbee radio TX power level via c4.sy.zpw.
      Documented for the APD120 — may not apply to the DIM1-Z. Changing radio
      power can affect mesh reliability; use with care.
    icon: mdi:radio-tower
    mode: single
    fields:
      target_device:
        name: Control4 Dimmer
        required: true
        selector:
          device: {integration: mqtt, manufacturer: Control4}
      level:
        name: Radio power level
        required: true
        default: 0
        selector:
          number: {min: 0, max: 255, step: 1, mode: box}
    variables:
      ieee: "{{ ((device_attr(target_device, 'identifiers') or []) | map('last') | select('search', '^zigbee2mqtt_0x') | first | default('')) | replace('zigbee2mqtt_', '') }}"
    sequence:
      - if: "{{ not ieee }}"
        then:
          - stop: "Not a Zigbee2MQTT device: {{ target_device }}"
            error: true
      - variables:
          c4_params:
            cmd: "c4.sy.zpw {{ '%02x' % (level | int(0)) }}"
            dst_ep: 1
      - action: mqtt.publish
        data:
          topic: "control4/{{ ieee }}/set"
          payload: "{{ {'send_raw': c4_params} | to_json }}"
